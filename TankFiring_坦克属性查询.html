<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>TankFiring · 5星坦克属性计算器</title>
<style>
/* TankFiring 5星坦克属性查询 · 移动端优先 */
:root {
  --bg: #1a1d23;
  --panel: #242830;
  --card: #2c313c;
  --card-atk: #3d2a2a;
  --card-hp: #2a3d2e;
  --card-rpr: #2a3340;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --accent: #f0b429;
  --input: #323842;
  --btn-fg: #1a1d23;
  --border: #3a4050;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
}

.wrap {
  max-width: 980px;
  margin: 0 auto;
  padding: 16px 12px 24px;
}

/* 标题 */
.title {
  color: var(--accent);
  font-size: 22px;
  font-weight: bold;
  margin: 0 4px 2px;
}
.subtitle {
  color: var(--muted);
  font-size: 12px;
  margin: 0 4px 12px;
  line-height: 1.5;
}

/* 控制面板 */
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 14px 10px;
}

.row { margin-bottom: 12px; }
.row:last-child { margin-bottom: 2px; }
.row-label {
  display: block;
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 6px;
}

select {
  width: 100%;
  appearance: none;
  -webkit-appearance: none;
  background: var(--input) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23e8eaed' stroke-width='1.5' fill='none'/></svg>") no-repeat right 12px center;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 16px;
  padding: 10px 34px 10px 12px;
  font-family: inherit;
}

/* 等级按钮 1-13 */
.levels {
  display: grid;
  grid-template-columns: repeat(13, minmax(0, 1fr));
  gap: 4px;
}
.lv-btn {
  min-height: 44px;
  border: none;
  border-radius: 7px;
  background: var(--input);
  color: var(--text);
  font-size: 15px;
  font-weight: bold;
  font-family: inherit;
  cursor: pointer;
  transition: transform 0.06s ease;
}
.lv-btn:active { transform: scale(0.94); }
.lv-btn.active {
  background: var(--accent);
  color: var(--btn-fg);
}
@media (max-width: 560px) {
  .levels { grid-template-columns: repeat(7, minmax(0, 1fr)); }
}

/* 滑条行：输入框 + 滑条 同一行 */
.slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.num-input {
  width: 72px;
  flex: none;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 16px;
  text-align: center;
  padding: 9px 4px;
  font-family: inherit;
}
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 36px;
  margin: 0;
  background: transparent;
  touch-action: none;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 3px;
  background: var(--input);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 26px;
  height: 26px;
  margin-top: -10px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--btn-fg);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  cursor: pointer;
}
input[type="range"]::-moz-range-track {
  height: 6px;
  border-radius: 3px;
  background: var(--input);
}
input[type="range"]::-moz-range-thumb {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--btn-fg);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  cursor: pointer;
}

/* 元信息 */
.meta-line {
  color: var(--muted);
  font-size: 13px;
  margin: 12px 4px 4px;
}

/* 属性卡片 */
.cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 8px;
}
.card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 14px 18px;
  text-align: center;
}
.card-atk { background: var(--card-atk); }
.card-hp  { background: var(--card-hp); }
.card-rpr { background: var(--card-rpr); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card-title { color: var(--muted); font-size: 15px; font-weight: bold; }
.up-toggle {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 13px; font-weight: normal;
  cursor: pointer; user-select: none; -webkit-user-select: none;
  padding: 4px 8px; border-radius: 6px;
}
.up-toggle:active { background: rgba(255, 255, 255, 0.07); }
.up-toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.up-toggle.on { color: var(--accent); }
.card-value {
  color: var(--text);
  font-size: 38px;
  font-weight: bold;
  line-height: 1.2;
  margin: 8px 0 4px;
  font-variant-numeric: tabular-nums;
}
.card-base { color: var(--muted); font-size: 14px; margin-top: 10px; }
.card-delta { color: var(--muted); font-size: 13px; margin-top: 6px; }

@media (min-width: 720px) {
  .cards { grid-template-columns: repeat(3, 1fr); }
  .card-value { font-size: 44px; }
}

/* 底部 */
.footer {
  margin-top: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
}
.footer b { color: var(--accent); }

</style>

  for (const [lv, v] of pts) {
    if (lv <= 0) { prevLv = 0; prevV = v; continue; }
    const start = Math.max(prevLv, 1);
    const end = Math.min(m, lv - 1);
    if (end >= start) total += prevV * (end - start + 1);
    if (m < lv) return total;
    prevLv = lv; prevV = v;
  }
  const start = Math.max(prevLv, 1);
  if (m >= start) total += prevV * (m - start + 1);
  return total;
}

function baseStat(tank, attr, level) {
  const row = (ATTRS[tank] || {})[attr];
  if (!row) return 0;
  const lv = clampInt(level, 1, 13);
  return row[lv - 1];
}

// (基础值, 累加加成, 最终值；加成 0 时最终值 = 基础+累加，加成 > 0 时 ×(100+pct)% 四舍五入)
function finalStat(tank, attr, level, medal, pct, upgraded = false) {
  const base = baseStat(tank, attr, level);
  const bonus = bonusSum(tank, attr, medal);
  // 已升级：基础值先 +4.5%
  const total = upgraded ? base * 1.045 + bonus : (base + bonus);
  // Python: no_pct = math.floor(total+0.5); then final = math.floor(total*(100+pct)/100+0.5);
  const noPct = Math.floor(total + 0.5);
  const final = Math.floor(noPct * (100 + pct) / 100 + 0.5);
  const extra = final - noPct;
  return { base, bonus, final, extra };
}

function fmt(n) { return n.toLocaleString("en-US"); }

// ===== UI =====

const state = { tank: TANK_ORDER[0], level: 1, medal: 0, pct: 0, "攻击Up": false, "血量Up": false, "维修Up": false };

const $ = (id) => document.getElementById(id);

function buildLevelButtons() {
  const box = $("levels");
  box.innerHTML = "";
  for (let lv = 1; lv <= 13; lv++) {
    const b = document.createElement("button");
    b.className = "lv-btn";
    b.type = "button";
    b.textContent = String(lv);
    b.addEventListener("click", () => { state.level = lv; render(); });
    box.appendChild(b);
  }
}

function render() {
  // 同步复选框状态和禁用状态
  if (state.level >= 13) {
    // 13 级及以上：强制禁用且取消勾选
    for (const attr of ["攻击", "血量", "维修"]) {
      const chk = document.getElementById(attr + "Up");
      if (chk) {
        chk.disabled = true;
        chk.checked = false;
        state[attr + "Up"] = false;
      }
    }
  } else {
    // 1-12 级：正常同步
    for (const attr of ["攻击", "血量", "维修"]) {
      const chk = document.getElementById(attr + "Up");
      if (chk) {
        chk.disabled = false;
        chk.checked = state[attr + "Up"];
      }
    }
  }
  // 等级按钮高亮
  const btns = $("levels").children;
  for (let i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("active", i + 1 === state.level);
  }
  // 控件回写（防越界）
  $("medalInput").value = state.medal;
  $("medalSlider").value = state.medal;
  $("pctInput").value = state.pct;
  $("pctSlider").value = state.pct;

  const [ttype, reloadS, speed, acc] = META[state.tank] || ["", 0, 0, 0];
  $("metaLine").textContent =
    `${state.tank}  ·  ${ttype}  ·  装填 ${reloadS}s  ·  速度 ${speed}  ·  精度 ${acc}`;

  for (const attr of ATTR_KEYS) {
    const r = finalStat(state.tank, attr, state.level, state.medal, state.pct, state[attr + "Up"]);
    $(attr + "Value").textContent = fmt(r.final);
    $(attr + "Base").textContent = "基础 " + fmt(r.base) + (state[attr + "Up"] ? "（已升级）" : "");
    // 计算升级加成值
    const base = baseStat(state.tank, attr, state.level);
    const upAdd = state[attr + "Up"] ? Math.round(base * 0.045) : 0;
    const parts = ["熟练度共 " + fmt(r.bonus)];
    if (state[attr + "Up"]) {
      parts.push("升级 + " + fmt(upAdd));
    }
    if (state.pct > 0) {
      parts.push("加成 + " + fmt(r.extra));
    }
    $(attr + "Delta").textContent = parts.join(" · ");
  }

  const atk = finalStat(state.tank, "攻击", state.level, state.medal, state.pct);
  const hp = finalStat(state.tank, "血量", state.level, state.medal, state.pct);
  const rpr = finalStat(state.tank, "维修", state.level, state.medal, state.pct);
  const dps = reloadS ? Math.round((atk.final / reloadS) * 10) / 10 : 0;
  $("footerLine").textContent =
    `综合：DPS≈${dps}  ·  等级 ${state.level}  ·  勋章 ${state.medal}  ·  加成 ${state.pct}%` +
    `  (累加：血量+${fmt(hp.bonus)} / 攻击+${fmt(atk.bonus)} / 维修+${fmt(rpr.bonus)})`;
}

function bindControls() {
  $("tankSel").addEventListener("change", (e) => { state.tank = e.target.value; render(); });
  $("medalSlider").addEventListener("input", (e) => { state.medal = clampInt(e.target.value, 0, 250); render(); });
  $("medalInput").addEventListener("input", (e) => { state.medal = clampInt(e.target.value, 0, 250); render(); });
  $("pctSlider").addEventListener("input", (e) => { state.pct = clampInt(e.target.value, 0, 65); render(); });
  $("pctInput").addEventListener("input", (e) => { state.pct = clampInt(e.target.value, 0, 65); render(); });
}

document.addEventListener("DOMContentLoaded", () => {
  const sel = $("tankSel");
  for (const t of TANK_ORDER) {
    const o = document.createElement("option");
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  }
  buildLevelButtons();
  bindControls();

  // 绑定已升级复选框
  const upChecks = ["攻击", "血量", "维修"];
  for (const attr of upChecks) {
    const chk = document.getElementById(attr + "Up");
    chk.addEventListener("change", () => {
      state[attr + "Up"] = chk.checked;
      render();
    });
  }

  render();
});

</script>
</body>
